<body>
<div id="app">
  <div id="boot" class="boot"><div class="bootbox"><div class="logo">VOID <b>EXTRACTOR</b></div><div class="muted">TACTICAL RELIC RECOVERY SYSTEM v4.2</div><div class="bootline"><i></i></div><div id="bootText" class="boottext">Mounting offline vault...<br>Calibrating procedural sector engine...<br>Restoring operator profile...</div></div></div>
  <div id="shell" class="shell hidden">
    <header class="topbar"><div class="brand">V<b>//</b>E</div><div id="rankPill" class="pill"></div><div class="topstats"><div id="creditPill" class="pill"></div><div id="shardPill" class="pill"></div></div><button id="soundBtn" class="iconbtn" aria-label="Sound">🔊</button></header>
    <main id="main" class="main"></main>
    <nav id="bottomNav" class="bottomnav"></nav>
  </div>
  <section id="raid" class="raid hidden">
    <div class="raidhud">
      <div class="portrait">⛨</div>
      <div class="hudbars"><div class="hudnums"><span id="hpTxt">HP</span><span id="armorTxt">ARM</span></div><div class="bar hp"><i id="hpBar"></i></div><div class="bar"><i id="energyBar"></i></div></div>
      <div class="pill" id="floorPill"></div><div class="pill" id="turnPill"></div>
      <div class="hudright"><button class="iconbtn" id="raidInvBtn">🎒</button><button class="iconbtn" id="raidMenuBtn">☰</button></div>
    </div>
    <div class="raidbody">
      <div id="canvasWrap" class="canvaswrap">
        <canvas id="gameCanvas" class="gamecanvas" width="750" height="510"></canvas>
        <div class="targethud"><div id="targetCard" class="targetcard">NO TARGET</div><div id="objectiveCard" class="objective"></div></div>
        <div id="combatLog" class="combatlog"></div>
      </div>
      <div class="controls">
        <div class="dpad">
          <button class="ctrl up" data-move="0,-1">▲</button><button class="ctrl left" data-move="-1,0">◀</button><button class="ctrl center" id="waitBtn">WAIT</button><button class="ctrl right" data-move="1,0">▶</button><button class="ctrl down" data-move="0,1">▼</button>
        </div>
        <div class="actions">
          <button class="act primary" id="shootBtn"><strong>◎</strong>FIRE</button>
          <button class="act" id="meleeBtn"><strong>⚔</strong>MELEE</button>
          <button class="act" id="reloadBtn"><strong>↻</strong>RELOAD</button>
          <button class="act" id="interactBtn"><strong>◇</strong>INTERACT</button>
          <button class="act" id="quickBtn"><strong>✚</strong>QUICK</button>
          <button class="act" id="swapBtn"><strong>⇄</strong>SWAP</button>
        </div>
      </div>
    </div>
  </section>
  <div id="report" class="report hidden"></div>
  <div id="modalBack" class="modalback hidden"><div id="modal" class="modal"></div></div>
  <div id="toastBox" class="toastbox"></div>
</div>
<script>

function rarityRoll(level=1,luck=0,r=Math.random){let x=r()+luck+Math.min(.16,level*.008);if(x>.995)return 5;if(x>.96)return 4;if(x>.87)return 3;if(x>.69)return 2;if(x>.39)return 1;return 0}
function genItem(level=1,forcedType=null,minRarity=0,r=Math.random){
 let list=BASES.filter(b=>!forcedType||b.type===forcedType||b.slot===forcedType);let base=deep(pick(list,r));
 let ri=Math.max(minRarity,rarityRoll(level,0,r));ri=clamp(ri,0,5);let mult=RARITIES[ri].mult*(1+(level-1)*.035);
 if(base.damage)base.damage=Math.max(1,Math.round(base.damage*mult));if(base.armor)base.armor=Math.round(base.armor*mult);if(base.hp)base.hp=Math.round(base.hp*mult);
 base.id=uid();base.level=level;base.rarity=ri;base.maxDurability=base.type==='weapon'?80+ri*12:95+ri*16;base.durability=base.maxDurability;base.currentAmmo=base.mag||0;base.affixes=[];
 let pool=AFFIXES.filter(a=>a.types.includes(base.type)&&(!a.filter||a.filter(base)));let count=Math.min(RARITIES[ri].aff,pool.length);
 for(let i=0;i<count;i++){let a=pool.splice(Math.floor(r()*pool.length),1)[0];a.apply(base);base.affixes.push({name:a.name,desc:a.desc})}
 base.value=Math.round(base.value*RARITIES[ri].sell*(1+level*.035));return base;
}

 eq.forEach(i=>{let m=(i.maxDurability&&i.durability<=0)?.5:1;maxHp+=(i.hp||0)*m;armor+=(i.armor||0)*m;dodge+=(i.dodge||0)*m;p.capacity+=(i.capacity||0)*m;p.weightCap+=(i.weightCap||0)*m;p.secureCap+=(i.secure||0)*m;p.critBonus+=(i.crit||0)*m;p.damageBonus+=(i.bonusDamage||0)*m;p.lifesteal+=(i.lifesteal||0)*m;p.thorns+=(i.thorns||0)*m;p.lootLuck+=(i.lootLuck||0)*m;for(let k of Object.keys(res))res[k]+=(i.resist?.[k]||0)*m+(i.allResist||0)*m});p.maxHp=Math.round(maxHp);if(fullHeal)p.hp=p.maxHp;else p.hp=Math.min(p.hp,p.maxHp);p.armor=Math.round(armor);p.dodge=clamp(dodge,0,.45);p.resist=res;p.maxEnergy=70+e.energy;p.energy=Math.min(p.energy,p.maxEnergy)}

function commitTurn(action){if(!raid?.active)return;let skipped=processPlayerStatuses();if(raid.player.hp<=0)return endRaid(false);if(skipped)logMsg('Neural lock — action lost.','bad');else action();raid.turns++;if(raid.turns>=6){let p=raid.props.find(x=>x.type==='extract');if(p)p.active=true}if(raid.player.hp<=0)return endRaid(false);enemyTurn();if(raid.player.hp<=0)return endRaid(false);let chilled=raid.player.statuses.some(s=>s.type==='chill');raid.player.energy=Math.min(raid.player.maxEnergy,raid.player.energy+(chilled?1:3));updateFOV();updateRaidUI();saveTransient();}

function selectTarget(){let p=raid.player,visible=raid.enemies.filter(e=>e.hp>0&&raid.map.visible[e.y][e.x]);if(raid.selected){let s=visible.find(e=>e.id===raid.selected);if(s)return s}visible.sort((a,b)=>dist(p,a)-dist(p,b));return visible[0]}
function playerShoot(){let w=currentWeapon();if(!w)return toast('No weapon equipped','bad');if((w.range||1)<=1)return playerMelee();let t=selectTarget();if(!t)return toast('No visible target','bad');if(dist(raid.player,t)>w.range||!lineOfSight(raid.player.x,raid.player.y,t.x,t.y))return toast('Target out of range or blocked','bad');if((w.currentAmmo||0)<=0)return toast('Magazine empty — reload','bad');if(raid.player.energy<6)return toast('Not enough energy','bad');commitTurn(()=>{w.currentAmmo--;raid.player.energy-=6;dealPlayerDamage(t,w);w.durability=Math.max(0,w.durability-.18);beep(w.damageType==='shock'?700:240,.06,w.damageType==='void'?'sawtooth':'square');haptic(18)})}
function playerMelee(){let p=raid.player,adj=raid.enemies.filter(e=>e.hp>0&&dist(p,e)<=1.5);let t=raid.selected?adj.find(e=>e.id===raid.selected):adj[0];if(!t)return toast('No adjacent enemy','bad');commitTurn(()=>meleeAttack(t))}
function meleeAttack(t){let w=currentWeapon(),use=w&&w.range<=1?w:{damage:5+Math.floor(profile.level/2),damageType:'kinetic',crit:.05,pen:0,name:'Field Strike'};dealPlayerDamage(t,use);raid.player.energy=Math.max(0,raid.player.energy-3);beep(130,.05,'sawtooth');haptic(25)}
function dealPlayerDamage(t,w){let p=raid.player,focused=p.statuses.some(s=>s.type==='focus'),raw=w.damage*(.9+raid.rng()*.22)*(1+p.damageBonus+(focused?.15:0)),crit=chance((w.crit||.05)+p.critBonus+(focused?.08:0),raid.rng);if(crit)raw*=1.75;let pen=(w.pen||0)+p.pen,dmg=mitigate(raw,w.damageType,t.armor,t.resist,pen);t.hp-=dmg;profile.records.damage+=dmg;floatAt(t.x,t.y,(crit?'CRIT ':'')+dmg,crit?'#ffd166':DT[w.damageType].color);logMsg(`${w.name} hits ${t.name} for ${dmg} ${w.damageType}.`);applyElementStatus(t,w.damageType,(w.statusPower||0)+.2,true);if(p.lifesteal){let heal=Math.max(1,Math.floor(dmg*p.lifesteal));p.hp=Math.min(p.maxHp,p.hp+heal)}if(t.hp<=0)killEnemy(t)}

function applyElementStatus(target,type,power=.2,fromPlayer=false){let r=raid.rng;if(type==='fire'&&chance(power+.12,r))addStatus(target,'burn',3,Math.max(2,Math.round((fromPlayer?profile.level:raid.floor)+2)));if(type==='cold'&&chance(power+.16,r))addStatus(target,'chill',4,1);if(type==='shock'&&chance(power+.08,r))addStatus(target,'stun',1,1);if(type==='toxic'&&chance(power+.18,r))addStatus(target,'poison',5,Math.max(1,Math.round((fromPlayer?profile.level:raid.floor)+1)));if(type==='void'&&chance(power+.15,r))addStatus(target,'exposed',4,8)}

function processStatuses(t,isPlayer=false){let skip=false;for(let s of [...t.statuses]){if(s.type==='burn'){t.hp-=s.power;isPlayer?logMsg(`Burn deals ${s.power}.`,'bad'):floatAt(t.x,t.y,s.power,'#ff765e')}if(s.type==='poison'){t.hp-=s.power;isPlayer?logMsg(`Poison deals ${s.power}.`,'bad'):floatAt(t.x,t.y,s.power,'#75ff78')}if(s.type==='stun')skip=true;if(s.type==='chill'&&chance(isPlayer ? .18 : .3,raid.rng))skip=true;s.turns--}t.statuses=t.statuses.filter(s=>s.turns>0);return skip}

function playerReload(){let w=currentWeapon();if(!w?.mag)return toast('Current weapon has no magazine','bad');let need=w.mag-(w.currentAmmo||0);if(need<=0)return toast('Magazine already full');let stacks=raid.player.bag.filter(i=>i.type==='ammo'&&i.ammoType===w.ammoType),have=stacks.reduce((a,i)=>a+i.qty,0);if(!have)return toast(`No ${w.ammoType} ammunition`,'bad');commitTurn(()=>{let n=Math.min(need,have);for(let s of stacks){let take=Math.min(n,s.qty);s.qty-=take;n-=take;if(!n)break}raid.player.bag=raid.player.bag.filter(i=>i.qty!==0);w.currentAmmo+=Math.min(need,have);logMsg(`${w.name} reloaded.`);beep(330,.08)})}

function useRaidItem(id){let p=raid.player,i=p.bag.find(x=>x.id===id);if(!i||i.type!=='consumable')return;let act=()=>{};if(i.kind==='medkit'){if(p.hp>=p.maxHp)return toast('Health already full');act=()=>{let n=Math.round(i.heal*(1+p.healBonus));p.hp=Math.min(p.maxHp,p.hp+n);logMsg(`Recovered ${n} HP.`)}}else if(i.kind==='plate'){act=()=>{let armors=Object.values(p.equipment).filter(x=>x?.type==='armor'&&x.maxDurability);for(let a of armors)a.durability=Math.min(a.maxDurability,a.durability+i.armorRepair);computePlayerStats();logMsg('Armor repaired.')}}else if(i.kind==='stim'){act=()=>{addStatus(p,'focus',12,1);p.energy=Math.min(p.maxEnergy,p.energy+45);logMsg('Combat stim engaged.')}}else if(i.kind==='antidote'){act=()=>{p.statuses=[];logMsg('Statuses purged.')}}else if(i.kind==='grenade'){let hits=raid.enemies.filter(e=>e.hp>0&&dist(p,e)<=2.5);if(!hits.length)return toast('No enemies in blast radius');act=()=>{hits.forEach(e=>{let d=mitigate(i.damage,'kinetic',e.armor,e.resist,5);e.hp-=d;floatAt(e.x,e.y,d,'#ffd166');if(e.hp<=0)killEnemy(e)});logMsg(`Grenade struck ${hits.length} hostiles.`);beep(90,.15,'sawtooth');haptic([40,30,60])}}else if(i.kind==='beacon'){act=()=>{raid.emergency={x:p.x,y:p.y,ready:raid.turns+6};logMsg('Emergency extraction beacon deployed.')}}commitTurn(()=>{act();i.qty--;if(i.qty<=0)p.bag=p.bag.filter(x=>x.id!==i.id)});closeModal()}
function playerInteract(){let p=raid.player,k=keyXY(p.x,p.y),ground=raid.ground[k]||[],prop=propAt(p.x,p.y);if(ground.length&&!['extract','stairs','emergency'].includes(prop?.type))return lootModal(k);if(!prop)return toast('Nothing to interact with');if(prop.type==='cache'){if(prop.opened)return toast('Cache is empty');commitTurn(()=>{prop.opened=true;let count=2+Math.floor(raid.rng()*3);for(let n=0;n<count;n++)dropItem(p.x,p.y,rollLoot());logMsg('Cache breached. Loot exposed.');beep(520,.1)});return}if(prop.type==='shrine'){if(prop.opened)return toast('Shrine is dormant');shrineModal(prop);return}if(prop.type==='stairs'){if(!raid.eliteDead)return toast('Warden signal still active','bad');confirmModal('Descend deeper?',`Floor ${raid.floor+1} increases enemy power and loot rarity.`,()=>{raid.floor++;raid.threat+=.65;profile.records.bestFloor=Math.max(profile.records.bestFloor,raid.floor);track('depth',raid.floor>=3?1:0);raid.rng=seeded(raid.seed+raid.floor*991);generateFloor();computePlayerStats();updateFOV();updateRaidUI();logMsg(`Descending to floor ${raid.floor}.`)})}if(prop.type==='extract'){if(raid.turns<6)return toast(`Extraction signal opens in ${6-raid.turns} turns`);commitTurn(()=>{raid.extractCharge++;logMsg(`Extraction channel ${raid.extractCharge}/2.`);if(raid.extractCharge>=2)setTimeout(()=>endRaid(true),100)})}if(prop.type==='emergency'){if(raid.turns<raid.emergency.ready)return toast(`Beacon calibrating: ${raid.emergency.ready-raid.turns} turns`);endRaid(true)}}
function shrineModal(prop){openModal(`<div class="modalhead"><h2>VOID SHRINE</h2><button class="close" data-close>✕</button></div><p class="muted">Trade blood for a raid-long mutation.</p><div class="grid"><button class="btn boon" data-boon="power">BLOOD EDGE<br><small>-15 HP · +18% damage</small></button><button class="btn boon" data-boon="ward">NULL WARD<br><small>-12 HP · +20 all resistance</small></button><button class="btn boon" data-boon="capacity">GREED POCKET<br><small>-10 HP · +5 capacity</small></button></div>`);$$('.boon').forEach(b=>b.onclick=()=>{let cost=b.dataset.boon==='power'?15:b.dataset.boon==='ward'?12:10;if(raid.player.hp<=cost+1)return toast('Too weak for the exchange','bad');commitTurn(()=>{raid.player.hp-=cost;prop.opened=true;if(b.dataset.boon==='power')raid.player.damageBonus+=.18;if(b.dataset.boon==='ward')for(let k in raid.player.resist)raid.player.resist[k]+=20;if(b.dataset.boon==='capacity')raid.player.capacity+=5;raid.boons.push(b.dataset.boon);logMsg('The shrine rewrites your body.')});closeModal()})}

 ['kills','Hostile Reduction','Eliminate {g} hostiles.',10,24,190,90],['extracts','Clean Returns','Successfully extract {g} times.',1,3,340,130],

 ];let picks=[];while(picks.length<5){let t=pick(templates,r);if(!picks.includes(t))picks.push(t)}return picks.map((t,ix)=>{let [type,name,desc,min,max,credits,xp]=t,goal=Math.round(min+r()*(max-min));if(type==='depth')goal=clamp(goal,3,9);if(type==='extracts'||type==='elites'||type==='craft'||type==='buys')goal=Math.max(min,Math.round(goal));return {id:`daily-${todayKey()}-${ix}-${type}`,daily:true,type,goal,progress:0,name,desc:desc.replace('{g}',goal),reward:{credits:Math.round(credits*(.9+r()*.3)),xp:Math.round(xp*(.9+r()*.3)),shards:chance(.28,r)?1:0}}})}

function rarityRoll(level=1,luck=0,r=Math.random){
 // Explicit tier probabilities prevent level/luck bonuses from spilling directly into Ascendant.
 let depth=clamp((level-1)/30,0,1);
 let luckMultiplier=1+clamp(luck,0,.25)*2;
 let chances=[
  {tier:7,chance:(.0002+depth*.0013)*luckMultiplier}, // Ascendant: 0.02%–0.225%
  {tier:6,chance:(.0015+depth*.0065)*luckMultiplier}, // Mythic
  {tier:5,chance:(.0060+depth*.0180)*luckMultiplier}, // Relic
  {tier:4,chance:(.0180+depth*.0420)*luckMultiplier}, // Legendary
  {tier:3,chance:.0600+depth*.0800},                  // Epic
  {tier:2,chance:.1600+depth*.0800},                  // Rare
  {tier:1,chance:.2800+depth*.0400}                   // Uncommon
 ];
 let roll=r(),cumulative=0;
 for(let entry of chances){cumulative+=entry.chance;if(roll<cumulative)return entry.tier}
 return 0;
}

function applyElementStatus(target,type,power=.2,fromPlayer=false){let r=raid.rng,boost=fromPlayer?(raid.player.statusPower||0):0,p=power+boost;if(type==='kinetic'&&chance(p*.45,r))addStatus(target,'bleed',3,Math.max(1,Math.round((fromPlayer?profile.level:raid.floor)/2+2)));if(type==='fire'&&chance(p+.12,r))addStatus(target,'burn',3,Math.max(2,Math.round((fromPlayer?profile.level:raid.floor)+2)));if(type==='cold'&&chance(p+.16,r))addStatus(target,'chill',4,1);if(type==='shock'&&chance(p+.08,r))addStatus(target,'stun',1,1);if(type==='toxic'&&chance(p+.18,r)){addStatus(target,'poison',5,Math.max(1,Math.round((fromPlayer?profile.level:raid.floor)+1)));if(chance(.35,r))addStatus(target,'corrosion',4,5+Math.floor((fromPlayer?profile.level:raid.floor)/2))}if(type==='void'&&chance(p+.15,r))addStatus(target,'exposed',4,8)}
function processStatuses(t,isPlayer=false){let skip=false;for(let s of [...t.statuses]){if(['burn','poison','bleed'].includes(s.type)){t.hp-=s.power;let col=s.type==='burn'?'#ff765e':s.type==='poison'?'#75ff78':'#ff334d';isPlayer?logMsg(`${s.type} deals ${s.power}.`,'bad'):floatAt(t.x,t.y,s.power,col)}if(s.type==='regen')t.hp=Math.min(t.maxHp,t.hp+s.power);if(s.type==='stun')skip=true;if(s.type==='chill'&&chance(isPlayer?.18:.3,raid.rng))skip=true;s.turns--}t.statuses=t.statuses.filter(s=>s.turns>0);return skip}
function dealPlayerDamage(t,w){let p=raid.player,focused=p.statuses.some(s=>s.type==='focus'),raw=w.damage*(.9+raid.rng()*.22)*(1+p.damageBonus+(focused?.15:0));if(t.hp/t.maxHp<.35)raw*=1+(w.execution||0)+p.execution;let crit=chance((w.crit||.05)+p.critBonus+(focused?.08:0),raid.rng);if(crit)raw*=1.75;let pen=(w.pen||0)+p.pen,corrosion=t.statuses.find(s=>s.type==='corrosion')?.power||0,dmg=mitigate(raw,w.damageType,Math.max(0,t.armor-corrosion),t.resist,pen);t.hp-=dmg;profile.records.damage+=dmg;floatAt(t.x,t.y,(crit?'CRIT ':'')+dmg,crit?'#ffd166':DT[w.damageType].color);logMsg(`${w.name} hits ${t.name} for ${dmg} ${w.damageType}.`);applyElementStatus(t,w.damageType,(w.statusPower||0)+.2,true);if(p.lifesteal){let heal=Math.max(1,Math.floor(dmg*p.lifesteal));p.hp=Math.min(p.maxHp,p.hp+heal)}let splash=(w.splash||0)+p.splash;if(splash)for(let e of raid.enemies.filter(e=>e.hp>0&&e.id!==t.id&&dist(e,t)<=1.6)){let sd=Math.max(1,Math.round(dmg*splash));e.hp-=sd;floatAt(e.x,e.y,sd,'#ff744f');if(e.hp<=0)killEnemy(e)}if(t.hp<=0)killEnemy(t);else if((w.multishot||0)+p.multishot&&chance(clamp((w.multishot||0)+p.multishot,0,.55),raid.rng)){let extra=Math.max(1,Math.round(dmg*.55));t.hp-=extra;floatAt(t.x,t.y,`2ND ${extra}`,'#fff1a8');if(t.hp<=0)killEnemy(t)}}
function enemyAttack(e){let p=raid.player,cloak=p.statuses.find(s=>s.type==='cloak'),dodge=clamp(p.dodge+(cloak?.power||0),0,.75);if(chance(dodge,raid.rng)){logMsg(`Dodged ${e.name}.`);floatAt(p.x,p.y,'DODGE','#ff334d');return}let exposed=p.statuses.find(s=>s.type==='exposed')?.power||0,corrosion=p.statuses.find(s=>s.type==='corrosion')?.power||0,raw=e.damage*(.88+raid.rng()*.25),dmg=mitigate(raw,e.type,Math.max(0,p.armor-corrosion),p.resist,exposed);if(p.barrierNow>0){let blocked=Math.min(p.barrierNow,dmg);p.barrierNow-=blocked;dmg-=blocked;floatAt(p.x,p.y,`BLOCK ${blocked}`,'#fff1a8')}if(dmg>0){p.hp-=dmg;damageArmor(dmg);floatAt(p.x,p.y,dmg,DT[e.type].color);logMsg(`${e.name} deals ${dmg} ${e.type}.`,'bad');applyElementStatus(p,e.type,.12,false)}if(p.thorns){e.hp-=p.thorns;floatAt(e.x,e.y,p.thorns,'#e8eef6');if(e.hp<=0)killEnemy(e)}beep(80,.08,'sawtooth');haptic([25,25,25])}
function enemyTurn(){let p=raid.player;for(let e of raid.enemies){if(e.hp<=0)continue;if(e.regen)e.hp=Math.min(e.maxHp,e.hp+e.regen);let skip=processStatuses(e);if(e.hp<=0){killEnemy(e);continue}if(skip)continue;let d=dist(e,p);if(d<=7)e.awake=true;if(!e.awake)continue;if(d<=1.5){enemyAttack(e);if(p.hp<=0)return}else if(e.ai==='ranged'&&d<=e.range&&lineOfSight(e.x,e.y,p.x,p.y)){enemyAttack(e);if(p.hp<=0)return}else{let step=nextStep(e.x,e.y,p.x,p.y,e.id);if(step){e.x=step.x;e.y=step.y;stepHazard(e)}}}if(raid.emergency&&raid.turns>=raid.emergency.ready&&!raid.props.some(x=>x.type==='emergency'))raid.props.push({type:'emergency',x:raid.emergency.x,y:raid.emergency.y,active:true,icon:'◉'})}
function commitTurn(action){if(!raid?.active)return;let skipped=processPlayerStatuses();if(raid.player.hp<=0)return endRaid(false);if(skipped)logMsg('Neural lock — action lost.','bad');else action();raid.turns++;if(raid.turns>=6){let p=raid.props.find(x=>x.type==='extract');if(p)p.active=true}if(raid.player.regen)raid.player.hp=Math.min(raid.player.maxHp,raid.player.hp+raid.player.regen);if(raid.player.hp<=0)return endRaid(false);enemyTurn();if(raid.player.hp<=0)return endRaid(false);let chilled=raid.player.statuses.some(s=>s.type==='chill');raid.player.energy=Math.min(raid.player.maxEnergy,raid.player.energy+(chilled?1:3)+(raid.player.energyRegen||0));updateFOV();updateRaidUI();saveTransient()}
function useRaidItem(id){let p=raid.player,i=p.bag.find(x=>x.id===id);if(!i||i.type!=='consumable')return;let act=()=>{};if(i.kind==='medkit'){if(p.hp>=p.maxHp)return toast('Health already full');act=()=>{let n=Math.round(i.heal*(1+p.healBonus));p.hp=Math.min(p.maxHp,p.hp+n);logMsg(`Recovered ${n} HP.`)}}else if(i.kind==='plate'){act=()=>{let armors=Object.values(p.equipment).filter(x=>x?.type==='armor'&&x.maxDurability);for(let a of armors)a.durability=Math.min(a.maxDurability,a.durability+i.armorRepair);computePlayerStats();logMsg('Armor repaired.')}}else if(i.kind==='stim'||i.kind==='overclock'){act=()=>{addStatus(p,'focus',i.kind==='overclock'?10:12,1);p.energy=Math.min(p.maxEnergy,p.energy+(i.kind==='overclock'?70:45));logMsg('Neural overclock engaged.')}}else if(i.kind==='nanogel'){act=()=>{addStatus(p,'regen',8,4+Math.floor(profile.level/3));logMsg('Regeneration nanites active.')}}else if(i.kind==='smoke'){act=()=>{addStatus(p,'cloak',7,.28);logMsg('Phase smoke bends targeting.')}}else if(i.kind==='scanner'){act=()=>{for(let y=0;y<raid.map.h;y++)for(let x=0;x<raid.map.w;x++)raid.map.explored[y][x]=true;raid.enemies.forEach(e=>e.awake=true);logMsg('Sector topology downloaded.')}}else if(i.kind==='antidote'){act=()=>{p.statuses=p.statuses.filter(s=>['focus','regen','cloak'].includes(s.type));logMsg('Harmful statuses purged.')}}else if(i.kind==='grenade'){let hits=raid.enemies.filter(e=>e.hp>0&&dist(p,e)<=2.5);if(!hits.length)return toast('No enemies in blast radius');act=()=>{hits.forEach(e=>{let d=mitigate(i.damage,'kinetic',e.armor,e.resist,5);e.hp-=d;floatAt(e.x,e.y,d,'#ffd166');if(e.hp<=0)killEnemy(e)});logMsg(`Grenade struck ${hits.length} hostiles.`);beep(90,.15,'sawtooth');haptic([40,30,60])}}else if(i.kind==='beacon'){act=()=>{raid.emergency={x:p.x,y:p.y,ready:raid.turns+6};logMsg('Emergency extraction beacon deployed.')}}commitTurn(()=>{act();i.qty--;if(i.qty<=0)p.bag=p.bag.filter(x=>x.id!==i.id)});closeModal()}
function renderReport(success,reason){let loot=raid.lootExtracted,materials=loot.filter(i=>i.type==='material');for(let i of materials){profile.materials[i.kind]=(profile.materials[i.kind]||0)+(i.qty||1);profile.stash=profile.stash.filter(x=>x.id!==i.id)}profile.records.itemsExtracted+=(success?loot.length:0);save();$('#report').innerHTML=`<div class="reportbox"><div class="muted">${raid.dungeon.icon} ${raid.dungeon.name.toUpperCase()} // RAID ${success?'COMPLETE':'FAILED'}</div><div class="bigresult ${success?'good':'bad'}">${success?'EXTRACTED':reason}</div><p class="muted">Floor ${raid.floor}/${MAX_FLOOR} · ${raid.turns} turns · ${raid.kills} kills · ${Math.floor((Date.now()-raid.startTime)/1000)} sec</p><div class="grid"><div class="card statbox"><small>CREDITS</small><b>${success?'¤'+raid.credits:'LOST'}</b></div><div class="card statbox"><small>XP</small><b>${success?raid.xp:'0'}</b></div><div class="card statbox"><small>ITEMS SAVED</small><b>${loot.length}</b></div><div class="card statbox"><small>DEPTH</small><b>${raid.floor}/${MAX_FLOOR}</b></div></div><div class="sectiontitle"><h2>RECOVERED ITEMS</h2></div><div class="lootstrip">${loot.map(i=>itemCard(i,`<button class="btn small ghost report-details" data-id="${i.id}">DETAILS</button>`)).join('')||'<div class="card empty">NO ITEMS RECOVERED</div>'}</div><div class="row" style="justify-content:center;padding-bottom:12px"><button class="btn primary" id="returnBtn">RETURN TO HIDEOUT</button><button class="btn ghost" id="redeployBtn" ${Object.keys(profile.loadout).length?'':'disabled'}>REDEPLOY ${raid.dungeon.icon}</button></div></div>`;$('#returnBtn').onclick=returnHideout;$('#redeployBtn').onclick=()=>{if(Object.keys(profile.loadout).length){$('#report').classList.add('hidden');startRaid(raid.dungeon.id)}};$$('.report-details').forEach(b=>b.onclick=()=>itemModal(loot.find(i=>i.id===b.dataset.id)))}

$$('.loadout-gems').forEach(b=>b.onclick=()=>itemModal(findProfileItemV3(b.dataset.id),null,'gems'));$$('.unequip').forEach(b=>b.onclick=()=>{let i=profile.loadout[b.dataset.slot];if(i){profile.stash.push(i);delete profile.loadout[b.dataset.slot];save();renderLoadout()}});$$('.unpack').forEach(b=>b.onclick=()=>{let ix=profile.pack.findIndex(i=>i.id===b.dataset.id);if(ix>=0)profile.stash.push(...profile.pack.splice(ix,1));save();renderLoadout()});$$('.unring').forEach(b=>b.onclick=()=>{let ix=profile.keyring.findIndex(i=>i.id===b.dataset.id);if(ix>=0)profile.stash.push(...profile.keyring.splice(ix,1));save();renderLoadout()})};

opStock.findIndex(i=>i.id===b.dataset.id),i=shopStock[ix],price=Math.round(effectiveItemValueV3(i)*1.35);if(profile.credits<price)return toast('Not enough credits','bad');profile.credits-=price;mergeInto(profile.stash,deep(i));shopStock.splice(ix,1);track('buys',1);save();renderTrader();beep(720);toast('Purchase transferred to stash','good')})}else{$('#rerollBlack').onclick=()=>{if(profile.credits<bc.credits||profile.shards<bc.shards)return toast('Black Market reroll requires more currency','bad');profile.credits-=bc.credits;profile.shards-=bc.shards;profile.blackMarket.rerolls++;blackMarketStockV4=makeBlackMarketV4();save();renderTrader();toast('Encrypted channel rerouted','good')};$$('.black-buy').forEach(b=>b.onclick=()=>{let ix=blackMarketStockV4.findIndex(i=>i.id===b.dataset.id),i=blackMarketStockV4[ix],price=blackMarketPriceV4(i);if(profile.credits<price)return toast('Not enough credits','bad');profile.credits-=price;mergeInto(profile.stash,deep(i));blackMarketStockV4.splice(ix,1);profile.records.blackMarketBuys++;save();renderTrader();beep(520,.12,'sawtooth');toast('Black Market transfer complete','good')})}bindItemInspect()};

renderContracts=function(){refreshDailyContracts();refreshV4Daily();let daily=contractViewV4==='daily',bounty=contractViewV4==='bounty',body;if(daily)body=`<div class="sectiontitle"><h2>DAILY CONTRACTS</h2><small>Refresh ${profile.contractDate}</small></div><div class="stack">${profile.contracts.map(q=>{let done=q.progress>=q.goal,claimed=profile.claimed.includes(q.id);return `<div class="card quest ${done?'done':''}"><div class="spread"><div><div class="muted">${q.daily?'DAILY':'LEGACY'}</div><b>${q.name}</b><p class="muted">${q.desc}</p></div><b>${Math.min(q.progress,q.goal)}/${q.goal}</b></div><div class="bar"><i style="width:${Math.min(100,q.progress/q.goal*100)}%"></i></div><p class="muted">Reward: ${q.reward.credits?'¤'+q.reward.credits+' ':''}${q.reward.shards?'◈'+q.reward.shards+' ':''}${q.reward.xp?q.reward.xp+' XP':''}</p>${done&&!claimed?`<button class="btn small primary claim" data-id="${q.id}">CLAIM</button>`:claimed?'<span class="good">CLAIMED</span>':''}</div>`}).join('')}</div>`;else if(bounty)body=`<div class="sectiontitle"><h2>NAMED BOUNTIES</h2><small>Three local daily targets</small></div><div class="stack">${profile.bounties.map(b=>{let op=resolveOperationV4(b.operationId);return `<div class="card bounty-card ${b.completed?'done':''}"><div class="spread"><div><div class="muted">${op.icon} ${op.name.toUpperCase()} // DEPTH ${b.targetFloor}</div><b>${b.name}</b><p class="muted">${b.desc}</p></div><b>${b.completed?'ELIMINATED':'ACTIVE'}</b></div><p class="muted">Reward: ¤${b.reward.credits} · ${b.reward.xp} XP · ◈${b.reward.shards}</p><div class="row">${!b.completed?`<button class="btn small primary track-bounty" data-id="${b.id}">TRACK & DEPLOY</button>`:''}${b.completed&&!b.claimed?`<button class="btn small primary claim-bounty" data-id="${b.id}">CLAIM</button>`:b.claimed?'<span class="good">PAID</span>':''}</div></div>`}).join('')}</div>`;else body=`<div class="sectiontitle"><h2>PROCUREMENT AUCTIONS</h2><small>Items are permanently submitted</small></div><div class="stack">${profile.auctions.map(a=>`<div class="card auction-criteria"><div class="spread"><div><b>${a.name}</b><p class="muted">${a.desc}</p></div><span class="${a.claimed?'good':'warn'}">${a.claimed?'FULFILLED':'OPEN'}</span></div><p class="muted">Payout: ${a.reward.credits?'¤'+a.reward.credits+' ':''}${a.reward.shards?'◈'+a.reward.shards+' ':''}${a.reward.xp?a.reward.xp+' XP':''}</p>${!a.claimed?`<button class="btn small primary fulfill-auction" data-id="${a.id}">SUBMIT ITEM</button>`:''}</div>`).join('')}</div>`;$('#main').innerHTML=`<div class="contract-tabs tabs"><button class="tab ${daily?'active':''}" data-contractview="daily">CONTRACTS</button><button class="tab ${bounty?'active':''}" data-contractview="bounty">BOUNTIES</button><button class="tab ${!daily&&!bounty?'active':''}" data-contractview="auction">AUCTIONS</button></div>${body}`;$$('[data-contractview]').forEach(b=>b.onclick=()=>{contractViewV4=b.dataset.contractview;renderContracts()});$$('.claim').forEach(b=>b.onclick=()=>{let q=profile.contracts.find(x=>x.id===b.dataset.id);if(!q||q.progress<q.goal)return;profile.credits+=q.reward.credits||0;profile.shards+=q.reward.shards||0;gainXP(q.reward.xp||0);profile.claimed.push(q.id);save();renderContracts();toast('Contract reward claimed','good')});$$('.track-bounty').forEach(b=>b.onclick=()=>{let q=profile.bounties.find(x=>x.id===b.dataset.id);if(!q)return;profile.selectedOperation=q.operationId;save();deployModal()});$$('.claim-bounty').forEach(b=>b.onclick=()=>claimBountyV4(b.dataset.id));$$('.fulfill-auction').forEach(b=>b.onclick=()=>fulfillAuctionV4(b.dataset.id))};

const V4_KILL_BASE=killEnemy;
killEnemy=function(e){let wasBounty=e.bountyId,keyBearer=e.keyBearer,wasAlive=e.hp<=0;V4_KILL_BASE(e);if(!wasAlive)return;if(keyBearer&&chance(.75,raid.rng)){profile.records.keysFound++;dropItem(e.x,e.y,makeKeyV4(clamp(1+Math.floor((raid.floor||1)/3),1,5),raid.rng))}if(wasBounty){let b=profile.bounties.find(x=>x.id===wasBounty);if(b&&!b.completed){b.progress=1;b.completed=true;profile.records.bountiesCompleted++;raid.credits+=Math.round(b.reward.credits*.18);raid.xp+=Math.round(b.reward.xp*.18);raid.timeline.push({turn:raid.turns,text:`Bounty eliminated: ${b.name}`,type:'good'});logMsg(`BOUNTY COMPLETE // ${b.name}`,'good')}}raid.objective=objectiveTextV4()};
dealPlayerDamage=function(t,w){let before=t.hp,type=w?.damageType||'kinetic',bonus=t.bounty?bountyDamageV4():0,old=raid.player.damageBonus;raid.player.damageBonus+=bonus;raid.shots++;V4_BASE.dealPlayerDamage(t,w);raid.player.damageBonus=old;let dealt=Math.max(0,before-t.hp);if(dealt>0){raid.hits++;raid.damageByType[type]=(raid.damageByType[type]||0)+dealt}if(raid.operation.kind==='heist')raid.alarm=Math.min(12,(raid.alarm||0)+.25)};
enemyAttack=function(e){let before=raid.player.hp,bar=raid.player.barrierNow||0;V4_BASE.enemyAttack(e);let taken=Math.max(0,(before+bar)-(raid.player.hp+(raid.player.barrierNow||0)));raid.damageTaken+=taken;if(raid.operation.kind==='heist'&&taken>0)raid.alarm=Math.min(12,(raid.alarm||0)+.15)};

dth:${raid.mission.progress/raid.mission.goal*100}%"></i></div><small>${raid.mission.progress}/${raid.mission.goal}</small></div>`}<div class="sectiontitle"><h2>PROTECTED KEYS</h2></div><div class="card">${p.keys.map(k=>`<div class="spread"><span class="lockquality-${k.keyQuality}">${k.icon} ${k.name}</span><b>${k.keyUses}/${k.keyMaxUses}</b></div>`).join('')||'<span class="muted">No keys deployed.</span>'}</div><div class="sectiontitle"><h2>ACTIVE WEAPON</h2></div>${itemCard(w,`<button class="btn small ghost raid-details" data-id="${w?.id}">DETAILS</button>${socketEligibleV3(w)?`<button class="btn small ghost raid-gems" data-id="${w?.id}">GEMS</button>`:''}`)}`};
updateRaidUI=function(){V4_BASE.updateRaidUI();if(!raid)return;let pill=raid.operation.kind==='endless'?`∞ W${raid.wave}`:raid.operation.kind==='heist'?`⌘ A${Math.floor(raid.alarm)}`:`${raid.operation.icon} F${raid.floor}/${operationMaxV4()}`;$('#floorPill').textContent=pill;$('#objectiveCard').textContent=objectiveTextV4()};

openLockModalV4=function(prop,kind='door'){let keys=usableKeysV4(prop.quality),breaker=raid.player.bag.find(i=>i.kind==='lockbreaker');openModal(`<div class="modalhead"><div><div class="muted">${kind==='door'?'SEALED ACCESS':'LOCKED CONTAINER'}</div><h2 class="lockquality-${prop.quality}">${prop.icon} ${lockNameV4(prop.quality)}</h2></div><button class="close" data-close>✕</button></div><div class="card"><p>${kind==='door'?'This access door protects an optional chamber or a classified Blacksite wing.':'This container has an enhanced loot table based on lock quality.'}</p><div class="muted">A key of equal or higher quality opens it quietly. Forced entry is always possible but causes damage, noise and alarm.</div></div><div class="sectiontitle"><h2>AVAILABLE KEYS</h2></div><div class="stack">${keys.map(k=>`<div class="card lock-option"><div><b class="lockquality-${k.keyQuality}">${k.icon} ${k.name}</b><div class="muted">Q${k.keyQuality} · ${k.keyUses}/${k.keyMaxUses} uses</div></div><button class="btn small primary use-key" data-id="${k.id}">UNLOCK</button></div>`).join('')||'<div class="card empty">NO COMPATIBLE KEY IN PROTECTED KEYRING</div>'}</div><div class="sectiontitle"><h2>FORCED ENTRY</h2></div><button class="btn danger force-lock" data-id="${breaker?.id||''}">${breaker?'USE HYDRAULIC LOCKBREAKER':'BRUTE FORCE ACCESS'}</button>`);$$('.use-key').forEach(b=>b.onclick=()=>unlockWithKeyV4(prop,b.dataset.id,kind));$('.force-lock').onclick=()=>forceLockV4(prop,$('.force-lock').dataset.id||null,kind)};
forceLockV4=function(prop,itemId,kind){let ix=itemId?raid.player.bag.findIndex(i=>i.id===itemId):-1,hasTool=ix>=0;commitTurn(()=>{if(hasTool){let item=raid.player.bag[ix];item.qty=(item.qty||1)-1;if(item.qty<=0)raid.player.bag.splice(ix,1)}prop.opened=true;prop.locked=false;raid.alarm=(raid.alarm||0)+(hasTool?2:4)+prop.quality;let raw=(hasTool?2:6)+prop.quality*(hasTool?2:5),dmg=Math.max(1,mitigate(raw,'kinetic',raid.player.armor,raid.player.resist,0));raid.player.hp-=dmg;raid.damageTaken+=dmg;if(kind==='container')openLockedContainerV4(prop);else raid.doorsOpened++;spawnReinforcementsV4((hasTool?1:2)+Math.floor(prop.quality/2),true);logMsg(`${hasTool?'Hydraulic':'Brute-force'} entry deals ${dmg} damage and raises alarm to ${Math.floor(raid.alarm)}.`,'bad');closeModal()})};

endRaid=function(success,reason='KIA'){if(!raid?.active)return;profile.keyring=(raid.player.keys||[]).map(deep).filter(k=>k.type==='key');profile.records.doorsOpened+=raid.doorsOpened||0;profile.records.lockedContainers+=raid.containersOpened||0;if(success&&raid.operation.kind==='heist')profile.records.heistsCompleted++;if(success&&raid.operation.kind==='endless')profile.records.endlessExtractions++;V4_BASE.endRaid(success,reason)};

function drawRaidRecapV4(){let c=$('#recapCanvas');if(!c||!raid?.map)return;let ctx=c.getContext('2d'),m=raid.map,scale=Math.max(2,Math.floor(Math.min(780/m.w,330/m.h)));c.width=m.w*scale;c.height=m.h*scale;ctx.fillStyle='#030103';ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){if(m.tiles[y][x]==='#')continue;ctx.fillStyle=m.explored[y][x]?(m.tiles[y][x]==='U'?'#4a2634':'#241016'):'#0c0507';ctx.fillRect(x*scale,y*scale,scale,scale)}let route=raid.route||[];if(route.length){ctx.strokeStyle='#ff334d';ctx.lineWidth=Math.max(1,scale*.55);ctx.beginPath();route.forEach((p,n)=>{let x=(p.x+.5)*scale,y=(p.y+.5)*scale;if(!n||p.type==='ladder')ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke()}for(let p of raid.props||[]){if(p.type==='locked_door'&&p.opened){ctx.fillStyle='#ffe36b';ctx.fillRect(p.x*scale,p.y*scale,scale,scale)}if(p.type==='ladder_up'||p.type==='ladder_down'){ctx.fillStyle='#bd7cff';ctx.fillRect(p.x*scale,p.y*scale,scale,scale)}}ctx.fillStyle='#76f59a';ctx.beginPath();ctx.arc((raid.entrance.x+.5)*scale,(raid.entrance.y+.5)*scale,Math.max(2,scale),0,Math.PI*2);ctx.fill();let last=route[route.length-1]||raid.player;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((last.x+.5)*scale,(last.y+.5)*scale,Math.max(2,scale*.85),0,Math.PI*2);ctx.fill()}

function buildGrandChambersV43(r){
 let w=39,h=25,tiles=Array.from({length:h},()=>Array(w).fill('#')),rooms=[];
 let specs=[[2,2,11,8],[15,2,10,7],[28,3,9,9],[3,14,12,8],[18,13,17,9]];
 for(let [x,y,rw,rh] of specs){x+=Math.floor(r()*2);y+=Math.floor(r()*2);let room={x,y,w:rw,h:rh,cx:x+Math.floor(rw/2),cy:y+Math.floor(rh/2)};rooms.push(room);for(let yy=y;yy<y+rh&&yy<h-1;yy++)for(let xx=x;xx<x+rw&&xx<w-1;xx++)tiles[yy][xx]='.';for(let n=0;n<3;n++){let px=x+2+Math.floor(r()*Math.max(1,rw-4)),py=y+2+Math.floor(r()*Math.max(1,rh-4));if(tiles[py]?.[px]==='.')tiles[py][px]='#'}}
 function corridor(a,b){let x=a.cx,y=a.cy;while(x!==b.cx){for(let q=-1;q<=1;q++)if(tiles[y+q]?.[x])tiles[y+q][x]='.';x+=Math.sign(b.cx-x)}while(y!==b.cy){for(let q=-1;q<=1;q++)if(tiles[y]?.[x+q])tiles[y][x+q]='.';y+=Math.sign(b.cy-y)}tiles[y][x]='.'}
 for(let n=1;n<rooms.length;n++)corridor(rooms[n-1],rooms[n]);corridor(rooms[0],rooms[3]);return {w,h,tiles,rooms}
}
function buildTransitGridV43(r){
 let w=39,h=25,tiles=Array.from({length:h},()=>Array(w).fill('#')),rooms=[];
 let ys=[4,12,20],xs=[6,19,32];
 for(let y of ys)for(let yy=y-1;yy<=y+1;yy++)for(let x=1;x<w-1;x++)tiles[yy][x]='.';
 for(let x of xs)for(let xx=x-1;xx<=x+1;xx++)for(let y=1;y<h-1;y++)tiles[y][xx]='.';
 for(let y of ys)for(let x of xs){let room={x:x-3,y:y-3,w:7,h:7,cx:x,cy:y};rooms.push(room);for(let yy=y-3;yy<=y+3;yy++)for(let xx=x-3;xx<=x+3;xx++)tiles[yy][xx]='.';if(chance(.7,r))tiles[y][x]='#'}

 placeOperationHazardsV4();spawnBountyV4(occupied);raid.player.barrierNow=Math.max(raid.player.barrierNow||0,raid.player.barrier||0);let normalStyle=op.kind==='standard'?(band===1?'ROOM SECTOR':band===2?'CAVERN NETWORK':band===3?'SECURITY MAZE':'WARDEN ARENA'):op.name.toUpperCase();raid.floorStyle=raid.generationVariantV43?.name||normalStyle;if(raid.generationVariantV43)raid.timeline.push({turn:raid.turns,text:`Rare generation: ${raid.generationVariantV43.name}`,type:'good'});raid.objective=objectiveTextV4()
};

const V43_BASE_ROLL_LOOT=rollLoot;
rollLoot=function(){let item=V43_BASE_ROLL_LOOT();if(item?.type==='key'){let keep=raid?.operation?.id==='blacksite'?.58:.32;if(!chance(keep,raid.rng))item=V4_BASE.rollLoot()}return item};

const V43_BASE_PLAYER_INTERACT=playerInteract;
playerInteract=function(){if(!raid?.active)return;let k=keyXY(raid.player.x,raid.player.y),ground=raid.ground[k]||[],prop=propAt(raid.player.x,raid.player.y);if(prop?.type==='annex_cache'){if(prop.opened)return ground.length?lootModal(k):toast('Annex cache empty');return openAnnexCacheV43(prop)}if(prop?.type==='annex_terminal'){if(prop.opened&&ground.length)return lootModal(k);return useAnnexTerminalV43(prop)}return V43_BASE_PLAYER_INTERACT()};

takeGround=function(k,id){let arr=raid.ground[k]||[],ix=arr.findIndex(i=>i.id===id),i=arr[ix];if(!i)return;if(!canCarry(i))return toast('Backpack capacity or weight exceeded','bad');mergeInto(raid.player.bag,i);arr.splice(ix,1);track('loot',1);beep(620,.04);toast(`${i.name} recovered`,'good');if(arr.length)lootModal(k);else closeModal();updateRaidUI()};

function equipBestPreviewV43(){let pool=[...profile.stash.filter(i=>i?.slot),...Object.values(profile.loadout||{}).filter(Boolean)],changes=[];for(let slot of EQUIP_SLOTS){let candidates=pool.filter(i=>i.slot===slot).sort((a,b)=>itemScore(b)-itemScore(a)),best=candidates[0],old=profile.loadout[slot];if(best&&best.id!==old?.id)changes.push({slot,best,old})}return changes}
function equipBestV43(){let nonEquip=profile.stash.filter(i=>!i?.slot),pool=[...profile.stash.filter(i=>i?.slot),...Object.values(profile.loadout||{}).filter(Boolean)],selected=new Set(),next={};for(let slot of EQUIP_SLOTS){let candidates=pool.filter(i=>i.slot===slot).sort((a,b)=>itemScore(b)-itemScore(a));if(candidates[0]){next[slot]=candidates[0];selected.add(candidates[0].id)}}profile.loadout=next;profile.stash=[...nonEquip,...pool.filter(i=>!selected.has(i.id))];save();renderStash();toast('Highest-Power loadout equipped','good')}
function confirmEquipBestV43(){let changes=equipBestPreviewV43();if(!changes.length)return toast('Current loadout already has the highest Power','good');confirmModal('Equip best loadout?',`Replace ${changes.length} slot${changes.length===1?'':'s'} using displayed Power: ${changes.map(c=>`${slotName(c.slot)} → ${c.best.name} (${itemScore(c.best)})`).join(' · ')}`,equipBestV43)}
function ammoPlanV43(){let weapons=Object.values(profile.loadout||{}).filter(i=>i?.type==='weapon'&&i.ammoType&&i.mag),needs={};for(let w of weapons)needs[w.ammoType]=(needs[w.ammoType]||0)+Math.max(18,w.mag*3);let plan=[];for(let [type,target] of Object.entries(needs)){let packed=profile.pack.filter(i=>i.type==='ammo'&&i.ammoType===type).reduce((a,i)=>a+(i.qty||0),0),available=profile.stash.filter(i=>i.type==='ammo'&&i.ammoType===type).reduce((a,i)=>a+(i.qty||0),0),move=Math.min(Math.max(0,target-packed),available);if(move>0)plan.push({type,target,packed,move})}return plan}
function packWeaponAmmoV43(){let plan=ammoPlanV43(),moved=0;for(let p of plan){let need=p.move,existing=profile.pack.find(i=>i.type==='ammo'&&i.ammoType===p.type);if(!existing&&profile.pack.length>=8)continue;for(let i of [...profile.stash.filter(i=>i.type==='ammo'&&i.ammoType===p.type)]){if(need<=0)break;let n=Math.min(need,i.qty||1),copy={...deep(i),id:uid(),qty:n};i.qty-=n;need-=n;moved+=n;mergeInto(profile.pack,copy);if(i.qty<=0)profile.stash=profile.stash.filter(x=>x.id!==i.id)}}save();renderStash();toast(moved?`${moved} compatible rounds packed`:'Raid pack has no free stack for matching ammunition',moved?'good':'bad')}
function confirmPackAmmoV43(){let plan=ammoPlanV43();if(!Object.values(profile.loadout||{}).some(i=>i?.ammoType))return toast('No ammunition-using weapon equipped','bad');if(!plan.length)return toast('Compatible ammunition is already packed or unavailable','warn');confirmModal('Pack compatible ammunition?',`Move up to ${plan.reduce((a,p)=>a+p.move,0)} rounds from the stash for ${plan.map(p=>AMMO[p.type]?.name||p.type).join(' and ')}.`,packWeaponAmmoV43)}

renderStash=function(){let filters=['all','weapon','armor','implant','charm','gem','key','contraband','consumable','ammo','material'],items=profile.stash.filter(i=>stashFilter==='all'||i.type===stashFilter);$('#main').innerHTML=`<div class="sectiontitle"><div><h2>STASH</h2><small>${profile.stash.length} items · Keyring ${profile.keyring.length}/${keyringCapV4()}</small></div><div class="row"><button class="btn small primary" id="equipBestV43">EQUIP BEST</button><button class="btn small ghost" id="packAmmoV43">PACK WEAPON AMMO</button></div></div><div class="tabs">${filters.map(f=>`<button class="tab ${f===stashFilter?'active':''}" data-filter="${f}">${f.toUpperCase()}</button>`).join('')}</div><div class="grid">${items.length?items.map(i=>itemCard(i,stashActions(i))).join(''):'<div class="card empty">NO ITEMS IN THIS CATEGORY</div>'}</div>`;$$('.tab').forEach(b=>b.onclick=()=>{stashFilter=b.dataset.filter;renderStash()});$('#equipBestV43').onclick=confirmEquipBestV43;$('#packAmmoV43').onclick=confirmPackAmmoV43;bindStashActions();bindItemInspect()};

function traderFiltersHTMLV43(stock,market){let filters=['all','weapon','armor','implant','charm','gem','key','contraband','consumable','ammo','material'],available=filters.filter(f=>f==='all'||stock.some(i=>i.type===f));return `<div class="tabs trader-filter-v43">${available.map(f=>`<button class="tab ${traderFiltersV43[market]===f?'active':''}" data-shopfilter="${f}">${f.toUpperCase()}</button>`).join('')}</div>`}
renderTrader=function(){refreshV4Daily();let night=traderViewV4==='night',market=night?'night':'black',stock=night?shopStock:blackMarketStockV4,filter=traderFiltersV43[market]||'all',shown=stock.filter(i=>filter==='all'||i.type===filter),cost=traderRerollCost(),bc=blackRerollCostV4(),dev=devFreeV43();$('#main').innerHTML=`<div class="contract-tabs tabs"><button class="tab ${night?'active':''}" data-market="night">NIGHT MARKET</button><button class="tab ${!night?'active':''}" data-market="black">BLACK MARKET</button></div>${night?`<div class="sectiontitle"><h2>NIGHT MARKET</h2><small>Daily stock · ¤${fmt(profile.credits)}</small></div><div class="card spread"><div><b>MARKET SIGNAL ${profile.trader.rerolls+1}</b><div class="muted">Legal equipment, supplies, gems and low-grade access keys.</div></div><button class="btn small ghost" id="rerollTrader">${dev?'REROLL // DEV':`REROLL ¤${cost}`}</button></div>`:`<div class="sectiontitle"><h2>BLACK MARKET</h2><small>¤${fmt(profile.credits)} · ◈${fmt(profile.shards)}</small></div><div class="card spread"><div><b>ENCRYPTED CHANNEL ${profile.blackMarket.rerolls+1}</b><div class="muted">Restricted equipment, high-quality keys, gems and contraband.</div></div><button class="btn small danger" id="rerollBlack">${dev?'REROLL // DEV':`REROLL ¤${bc.credits} + ◈${bc.shards}`}</button></div>`}${traderFiltersHTMLV43(stock,market)}<div class="sectiontitle"><h2>AVAILABLE STOCK</h2><small>${shown.length}/${stock.length} offers</small></div><div class="grid">${shown.map(i=>{let price=night?Math.round(effectiveItemValueV3(i)*1.35):blackMarketPriceV4(i);return itemCard(i,`<button class="btn small primary ${night?'buy':'black-buy'}" data-id="${i.id}">${dev?'BUY // DEV':`BUY ¤${price}`}</button><button class="btn small ghost inspect" data-id="${i.id}">DETAILS</button>`)}).join('')||'<div class="card empty">NO OFFERS IN THIS CATEGORY</div>'}</div>`;$$('[data-market]').forEach(b=>b.onclick=()=>{traderViewV4=b.dataset.market;renderTrader()});$$('[data-shopfilter]').forEach(b=>b.onclick=()=>{traderFiltersV43[market]=b.dataset.shopfilter;renderTrader()});if(night){$('#rerollTrader').onclick=()=>{if(!dev&&profile.credits<cost)return toast('Not enough credits to reroll','bad');if(!dev)profile.credits-=cost;profile.trader.rerolls++;shopStock=makeShop();save();renderTrader();toast(`Trader inventory rerolled${dev?' // DEV':''}`,'good')};$$('.buy').forEach(b=>b.onclick=()=>{let ix=shopStock.findIndex(i=>i.id===b.dataset.id),i=shopStock[ix];if(!i)return;let price=Math.round(effectiveItemValueV3(i)*1.35);if(!dev&&profile.credits<price)return toast('Not enough credits','bad');if(!dev)profile.credits-=price;mergeInto(profile.stash,deep(i));shopStock.splice(ix,1);track('buys',1);save();renderTrader();beep(720);toast(`Purchase transferred${dev?' // DEV':''}`,'good')})}else{$('#rerollBlack').onclick=()=>{if(!dev&&(profile.credits<bc.credits||profile.shards<bc.shards))return toast('Black Market reroll requires more currency','bad');if(!dev){profile.credits-=bc.credits;profile.shards-=bc.shards}profile.blackMarket.rerolls++;blackMarketStockV4=makeBlackMarketV4();save();renderTrader();toast(`Encrypted channel rerouted${dev?' // DEV':''}`,'good')};$$('.black-buy').forEach(b=>b.onclick=()=>{let ix=blackMarketStockV4.findIndex(i=>i.id===b.dataset.id),i=blackMarketStockV4[ix];if(!i)return;let price=blackMarketPriceV4(i);if(!dev&&profile.credits<price)return toast('Not enough credits','bad');if(!dev)profile.credits-=price;mergeInto(profile.stash,deep(i));blackMarketStockV4.splice(ix,1);profile.records.blackMarketBuys++;save();renderTrader();beep(520,.12,'sawtooth');toast(`Black Market transfer complete${dev?' // DEV':''}`,'good')})}bindItemInspect()};

 ];openModal(`<div class="modalhead"><div><h2>FIELD MANUAL v4.3</h2><div class="muted">Architecture, automation and testing update</div></div><button class="close" data-close>✕</button></div><div class="stack">${points.map(([h,p])=>`<div class="card"><b>${h}</b><p class="muted">${p}</p></div>`).join('')}</div>`)};

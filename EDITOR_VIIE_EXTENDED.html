<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#130309">
<title>VOID Preset Map Editor</title>
<style>
:root{--bg:#090306;--panel:#16080d;--panel2:#211016;--line:#54222e;--text:#fff2f4;--muted:#c0a0a7;--red:#ff3654;--red2:#9e1830;--green:#9df4b5;--amber:#ffd18a;--cyan:#b4eff7;--purple:#e0c6ff;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}body{background:radial-gradient(circle at 15% 0%,#2c0710 0,transparent 34%),#090306}.app{min-height:100vh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(13,4,8,.96);backdrop-filter:blur(12px)}.logo{font-weight:1000;letter-spacing:-1px}.logo b{color:var(--red)}.badge{font-size:10px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.status{margin-left:auto;font-size:11px;color:var(--green)}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:10px;padding:10px;min-height:0;flex:1}.pane{min-width:0;background:rgba(18,6,10,.94);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.scroll{height:calc(100vh - 78px);overflow:auto;padding:12px}.center{display:flex;flex-direction:column;min-height:0}.centerbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px;border-bottom:1px solid var(--line);background:#12060a}.mapscroll{flex:1;min-height:420px;overflow:auto;background:#040204;position:relative;touch-action:pan-x pan-y}.mapstage{min-width:100%;min-height:100%;display:grid;place-items:center;padding:18px}canvas{display:block;image-rendering:pixelated;border:1px solid #713044;background:#020102;box-shadow:0 16px 50px rgba(0,0,0,.42);touch-action:none}.section{margin:0 0 14px}.section h2{font-size:12px;letter-spacing:.7px;margin:0 0 8px;color:#ffd8de}.help{font-size:10px;line-height:1.5;color:var(--muted);margin:6px 0}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:10px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0d0407;border-radius:9px;padding:9px;outline:none;user-select:text}.field textarea{resize:vertical;min-height:72px}.field input:focus,.field textarea:focus{border-color:var(--red)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{border:1px solid #713044;background:linear-gradient(#351019,#230a10);border-radius:9px;padding:9px 10px;font-weight:900;font-size:10px;min-height:38px}.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}.btn.primary{background:linear-gradient(#a81a34,#651020);border-color:#ff4863}.btn.ghost{background:#110509}.btn.danger{background:#341018;border-color:#8b2a3c}.btn.active{outline:2px solid #ff6b82;background:#50121f}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}.chancegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.chance{padding:7px 3px;min-height:34px}.chance.active{background:#7d1628;border-color:#ff526c}.groups{display:grid;gap:9px}.group{border-top:1px solid #30141b;padding-top:8px}.group:first-child{border-top:0;padding-top:0}.groupname{font-size:9px;color:var(--muted);margin-bottom:6px;letter-spacing:.8px}.brushes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.brush{min-height:54px;padding:5px;border:1px solid #3d1a23;background:#100508;border-radius:8px;font-size:9px;overflow:hidden}.brush strong{font-size:17px;display:block;line-height:1.2}.brush.active{border-color:#ff536c;background:#3b0d17;box-shadow:inset 0 0 0 1px #ff536c}.brush small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.card{border:1px solid var(--line);background:#100508;border-radius:10px;padding:10px;margin-bottom:8px}.card b{font-size:11px}.muted{color:var(--muted)}.good{color:var(--green)}.bad{color:#ff8797}.warn{color:var(--amber)}.code{width:100%;min-height:220px;border:1px solid var(--line);background:#050204;color:#ffe8ec;border-radius:9px;padding:10px;resize:vertical;font-size:10px;line-height:1.45;user-select:text}.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:9px}.legend div{display:flex;gap:6px;align-items:center}.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}.inspector-name{font-size:14px;font-weight:1000}.big{font-size:21px;font-weight:1000}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-size:9px;color:var(--muted)}.preview-msg{padding:6px 9px;font-size:10px;color:var(--muted);border-top:1px solid var(--line)}.kbd{padding:2px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#18070c}.tooltip{position:fixed;z-index:99;max-width:260px;padding:8px 10px;background:#240b12;border:1px solid #823044;border-radius:8px;font-size:10px;line-height:1.45;color:#ffe6eb;pointer-events:none;display:none;box-shadow:0 12px 35px #000}.tiny{font-size:9px}.separator{height:1px;background:var(--line);margin:10px 0}.hidden{display:none!important}
@media(max-width:1050px){.workspace{grid-template-columns:270px minmax(0,1fr)}.right{grid-column:1/-1}.right .scroll{height:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.right .section{min-width:0}}
@media(max-width:720px){.top{position:static;flex-wrap:wrap}.workspace{display:block}.pane{margin-bottom:10px}.scroll{height:auto;max-height:none}.center{min-height:650px}.mapscroll{min-height:470px}.right .scroll{display:block}.brushes{grid-template-columns:repeat(4,1fr)}.twocol{grid-template-columns:1fr}.status{width:100%;margin:0}.mapstage{justify-content:start;align-content:start;padding:10px}}
